<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>KotoLens Flashcards</title>
  <link rel="stylesheet" href="pages.css" />
  <style>
    .tabs { display: flex; gap: 4px; margin-top: 16px; border-bottom: 1px solid var(--border); }
    .tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 8px 12px; color: var(--muted); }
    .tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
    .progress { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; margin-top: 16px; }
    .progress > div { height: 100%; background: var(--accent); transition: width 0.2s; }
    .flash { min-height: 340px; display: grid; align-content: center; justify-items: center; text-align: center; gap: 10px; }
    .front { font-size: 44px; line-height: 2; }
    .front.english { font-size: 26px; line-height: 1.4; }
    .back { width: 100%; border-top: 1px dashed var(--border); padding-top: 16px; margin-top: 8px; display: grid; gap: 6px; justify-items: center; }
    .meaning { font-size: 20px; }
    .roman { color: var(--muted); font-style: italic; }
    .pos { font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 0 8px; }
    .example { margin-top: 10px; background: var(--surface-2); border-radius: 10px; padding: 12px 14px; max-width: 560px; text-align: left; }
    .example .jp { font-size: 18px; line-height: 2; }
    .grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
    .grades button { display: grid; gap: 2px; padding: 10px; }
    .grades small { color: var(--muted); font-size: 11px; }
    .g0 { color: var(--danger); } .g3 { color: var(--good); }
    kbd { font-size: 11px; border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; color: var(--muted); }
    button.primary kbd { color: inherit; border-color: currentColor; opacity: 0.8; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    th { font-size: 12px; color: var(--muted); font-weight: 600; }
    td.word { font-size: 18px; line-height: 1.9; }
    .empty { text-align: center; padding: 48px 16px; color: var(--muted); }
    @media (max-width: 560px) { .front { font-size: 34px; } .grades { grid-template-columns: repeat(2, 1fr); } .hide-sm { display: none; } }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="row">
      <h1><span class="brand">KotoLens</span> flashcards</h1>
      <span class="spacer"></span>
      <a href="options.html" class="small">Settings</a>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-review" aria-selected="true">Review</button>
      <button role="tab" id="tab-cards" aria-selected="false">All cards</button>
    </div>

    <section id="panel-review">
      <div class="row" style="margin-top:12px">
        <span class="muted small" id="counter"></span>
        <span class="spacer"></span>
        <label class="check small" style="margin:0"><input type="checkbox" id="frontFurigana" /> Furigana on front</label>
        <select id="direction" style="width:auto">
          <option value="foreign-first">日本語/한국어 → English</option>
          <option value="english-first">English → 日本語/한국어</option>
        </select>
      </div>
      <div class="progress"><div id="bar" style="width:0"></div></div>
      <div class="card flash" id="flash"></div>
    </section>

    <section id="panel-cards" hidden>
      <div class="row" style="margin-top:12px">
        <input type="search" id="search" placeholder="Search cards…" style="flex:1;min-width:180px" />
        <select id="langFilter" style="width:auto">
          <option value="">All languages</option>
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
        </select>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="exportCsv">Export for Anki (CSV)</button>
        <button id="exportJson">Back up (JSON)</button>
        <button id="importJson">Restore…</button>
        <input type="file" id="importFile" accept="application/json" hidden />
      </div>
      <div class="card" style="padding:8px 12px"><table><thead><tr><th>Word</th><th>Meaning</th><th class="hide-sm">Next review</th><th></th></tr></thead><tbody id="rows"></tbody></table><div id="noCards" class="empty" hidden>No cards yet. Highlight text on any page, right-click, and use ＋ to add words.</div></div>
    </section>
  </main>
  <script src="review.js"></script>
</body>
</html>
